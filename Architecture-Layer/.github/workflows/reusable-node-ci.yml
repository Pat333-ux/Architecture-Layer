name: Beast3 Node CI

on:
  workflow_call:
    inputs:
      run_tests:
        type: boolean
        required: false
        default: true

jobs:
  node-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - if: ${{ inputs.run_tests }}
        run: npm test --if-present
      - run: npm run build --if-present
